# Visits the live site every 10 minutes so the free Render service does not fall asleep and the
# free Aiven database stays in use (Aiven switches off free databases it sees as unused).
# /api/ping only answers when the database does, so a failed run means the site or the database
# is down: GitHub then emails the person who last changed this file. Steps to fix: DEPLOY.md.
name: Keep the site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Visit the site
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Ping the site and its database
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://klenz-tissue.onrender.com' }}
        run: |
          # A sleeping site takes about a minute to wake, so allow for that and try three times.
          for attempt in 1 2 3; do
            if curl -fsS --max-time 100 "${SITE_URL%/}/api/ping"; then
              echo
              echo "Site and database are up." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt failed; trying again in 30 seconds."
            sleep 30
          done
          echo "::error::$SITE_URL did not answer, or its database is down. See DEPLOY.md (Site does not open)."
          exit 1
